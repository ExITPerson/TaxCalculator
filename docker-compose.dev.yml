services:
  postgres:
    image: postgres:16-alpine
    container_name: taxcalc-pg-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: taxcalc
      POSTGRES_PASSWORD: taxcalc
      POSTGRES_DB: taxcalc
      TZ: Europe/Moscow
    ports:
      - "5433:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxcalc -d taxcalc"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data_dev: